name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_baselines:
        description: Execute the five fixed Phase 6 development baseline evaluations
        type: boolean
        default: false
      run_advanced:
        description: Execute Phase 6 prerequisites and all five Phase 7 evaluations
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cheap-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: make check
      - run: make status
  # Explicit manual dispatch runs the real full-file and frozen-split gates.
  full-data-validation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: data/raw/criteo-research-uplift-v2.1.csv.gz
          key: criteo-v2.1-2716e1bf0fd157a93b5bf86924d9088419dfbac2022c6cd90030220634f616dc
      # Only archive bytes are cached; validation must execute on restored bytes.
      - run: make acquire
      - run: uv run --locked uplift validate --full
      - run: make ingest
      - run: uv run --locked uplift split --reconstruct
      - run: uv run --locked pytest tests/test_full_data.py -m full_data
      - run: make audit
      - run: uv run --locked pytest tests/test_data_audit_full.py -m full_data
      - run: make ate
      - run: uv run --locked pytest tests/test_development_ate_full.py -m full_data
      - name: First frozen development baseline split
        if: inputs.run_baselines || inputs.run_advanced
        run: uv run --locked uplift baselines --first-split
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
      - name: Verify first-split training, prediction and policy calculations
        if: inputs.run_baselines || inputs.run_advanced
        run: uv run --locked pytest tests/test_baselines_full.py -m full_data
        env:
          PHASE6_EVIDENCE: reports/phase_6_first_split.json
      - name: Remaining unchanged development baseline recipes
        if: inputs.run_baselines || inputs.run_advanced
        run: make baselines
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
      - name: Verify completed baselines and protected inputs
        if: inputs.run_baselines || inputs.run_advanced
        run: uv run --locked pytest tests/test_baselines_full.py -m full_data
      - name: First Phase 7 split
        if: inputs.run_advanced
        run: uv run --locked uplift advanced --first-split
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
      - name: Verify first Phase 7 split before remaining fits
        if: inputs.run_advanced
        run: uv run --locked pytest tests/test_advanced_full.py -m full_data
        env:
          PHASE7_EVIDENCE: reports/phase_7_first_split.json
          OPENBLAS_NUM_THREADS: "2"
      - name: Remaining unchanged Phase 7 recipes
        if: inputs.run_advanced
        run: make advanced
        env:
          OPENBLAS_NUM_THREADS: "2"
          OMP_NUM_THREADS: "2"
      - name: Verify Phase 7 and preservation of Phase 6
        if: inputs.run_advanced
        run: uv run --locked pytest tests/test_advanced_full.py tests/test_baselines_full.py -m full_data
        env:
          OPENBLAS_NUM_THREADS: "2"
      - uses: actions/upload-artifact@v4
        if: inputs.run_advanced
        with:
          name: phase-7-development-verification
          path: |
            reports/phase_7_first_split.json
            reports/phase_7_metrics.json
            reports/phase_7_comparison.md
            reports/phase_7_stability.md
      - uses: actions/upload-artifact@v4
        with:
          name: full-data-verification
          path: |
            reports/validation.json
            reports/ingestion.json
            reports/split_reconstruction.json
            reports/data_audit.json
            reports/data_audit.md
            reports/development_ate.json
            reports/development_ate.md
      - uses: actions/upload-artifact@v4
        if: inputs.run_baselines || inputs.run_advanced
        with:
          name: phase-6-development-verification
          path: |
            reports/phase_6_first_split.json
            reports/phase_6_metrics.json
            reports/phase_6_baselines.md
            reports/phase_6_stability.md
